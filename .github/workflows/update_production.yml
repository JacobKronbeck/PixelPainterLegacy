name: Verify Web Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: mytestvueapp.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: mytestvueapp.client
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: mytestvueapp.client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API
        run: dotnet restore MyTestVueApp.Server/MyTestVueApp.Server.csproj

      - name: Build API
        run: dotnet build MyTestVueApp.Server/MyTestVueApp.Server.csproj --configuration Release --no-restore
