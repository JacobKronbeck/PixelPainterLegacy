name: Verify Web Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: mytestvueapp.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: mytestvueapp.client
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: mytestvueapp.client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API tests
        run: dotnet restore MyTestVueApp.Server.Tests/MyTestVueApp.Server.Tests.csproj

      - name: Build API and tests
        run: dotnet build MyTestVueApp.Server.Tests/MyTestVueApp.Server.Tests.csproj --configuration Release --no-restore

      - name: Run API integration tests
        run: dotnet test MyTestVueApp.Server.Tests/MyTestVueApp.Server.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build production API container
        run: docker build --file MyTestVueApp.Server/Dockerfile .
